name: Update Yoda Playlist

on:
  workflow_dispatch: # İstediğiniz zaman elle "Run workflow" butonuna basarak çalıştırabilirsiniz

permissions:
  contents: write # GitHub Actions botuna repoya yazma (push) izni verir

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run script
        run: python bot.py

      - name: Commit and push updated playlist
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add yoda_playlist.m3u
          git commit -m "Auto-update m3u playlist" || echo "No changes to commit"
          git push
